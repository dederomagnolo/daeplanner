# Offline simulator config. Keys intentionally mirror the ROS planner YAML.

camera/horizontal_fov: 103.2
camera/vertical_fov: 77.4

raycast/dr: 0.2
raycast/dphi: 10
raycast/dtheta: 10

system/bbx/r: 0.2

aep/gain/r_min: 0
aep/gain/r_max: 5
aep/gain/zero: 15
aep/gain/lambda: 0.75
aep/tree/extension_range: 1
aep/tree/max_sampling_radius: 10
aep/tree/initial_iterations: 15

daep/rrt/max_sampled_initial_nodes: 30
daep/rrt/max_sampled_nodes: 70
daep/dfm/zeta: 0.5

boosted_boundary_length: 1
boost_magnitude: 6

drone_linear_velocity: 0.5
drone_angular_velocity: 1

boundary/min: [-5, -20, 0.0]
boundary/max: [70, 40, 5]
res: 0.2
