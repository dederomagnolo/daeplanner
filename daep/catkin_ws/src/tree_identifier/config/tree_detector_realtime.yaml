slice_z_min: 1.15
slice_z_max: 1.45
max_points: 180000

# Options:
#   dbscan_gmm       -> DBSCAN + optional GMM split + circle RANSAC
#   dbscan_gmm_rlts  -> DBSCAN + optional GMM split + circle RLTS
#   grid_cc          -> grid connected-components + circle RANSAC
clustering_mode: dbscan_gmm
dbscan_eps: 0.30
dbscan_min_samples: 10
min_cluster_points: 3

enable_gmm_split: true
gmm_radius_threshold: 0.25
gmm_min_points: 10
gmm_components: 2
gmm_min_center_dist: 0.0

ransac_iterations: 50
ransac_distance_threshold: 0.01
ransac_min_inlier_ratio: 0.45

cell_size: 0.20
min_points_per_cell: 3
min_cells_per_cluster: 3
max_cells_per_cluster: 200

min_diameter: 0.15
max_diameter: 0.50
marker_lifetime: 0.8
